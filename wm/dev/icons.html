<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Weather Machine icon review</title><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="../fonts/fonts.css"><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../typography.css"><style>body{padding:24px}h1{font-size:24px;margin-bottom:20px}.samples{display:grid;gap:12px;max-width:740px}.sample{display:grid;grid-template-columns:155px repeat(3,1fr);align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:14px}.sample>span{display:flex;align-items:center;gap:14px}.sample small{color:var(--muted)}.sample svg{color:var(--ink)}</style></head>
<body><h1>Original icon review</h1><div class="samples"></div><script type="module">import{icon}from'../js/icons.js';const samples=[['rain','Rain'],['lativ','Professor Lativ'],['lativBot','Lativ’s Bot · L mouth'],['bot','Your Bot'],['saboteurBot','Saboteur Bot · visor']];document.querySelector('.samples').innerHTML=samples.map(([id,label])=>`<div class="sample"><b>${label}</b>${[18,24,40].map(size=>`<span>${icon(id,size)}<small>${size}px</small></span>`).join('')}</div>`).join('');</script></body>
</html>
