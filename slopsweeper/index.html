<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Slopsweeper</title>
  <meta name="description" content="A turn-based puzzle about building software under deadline with AI assistance.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HUD is DOM, board is canvas (SPEC §10.3). The ids are the contract with src/ui/hud.js.
       The top bar is WALKER-FIRST (owner decision 2026-08-05). The most important thing in this
       game is the people standing still, so the bar carries them and almost nothing else; the
       level picker, the seed link, the turn counter and the remaining count are settings and
       tallies rather than pressure, and they moved one tap away into #drawer. -->
  <header id="topbar">
    <button id="btn-menu" class="chip" title="Level, seed and turn count"><span class="burger">☰</span><span class="narrow-hide">MENU</span></button>
    <button id="btn-restart" class="chip" title="New game — rerolls the seed unless ?seed= pins it">RESTART</button>
    <!-- The walker strip: the bar's whole point, and the only place the eye is meant to land.
         WAITING is the tension meter, so it is the biggest type on the page — the count says you
         are behind, and the number after the dot says how many turns the least patient of them
         will keep waiting, which is the half you can still do something about. Past two thirds
         of a patience bar the countdown and the chip around it go red together. It is also still
         the door to the roster (src/ui/roster.js).
         NEXT IN and SERVED · LOST ride beside it in the ordinary chip size: those two are the
         persistent arrival forecast SPEC §6.1 asks for (see the note on #fc-remaining below). -->
    <div id="walkers">
      <button id="btn-roster" title="Turns before the most impatient user gives up — tap for the roster">
        <span class="wl-label"><span class="tiny-hide">WAITING</span><span class="tiny-only">WAIT</span></span>
        <b id="fc-waiting">—</b><b id="fc-soonest"></b>
      </button>
      <span class="chip wk-next" title="Turns until the next user arrives"><span class="tiny-hide">NEXT IN</span><span class="tiny-only">NEXT</span> <b id="fc-next">—</b></span>
      <!-- Users served is the whole point total; users lost are the ones no amount of building
           brings back. -->
      <span id="score" class="chip" title="Users served · users lost for good">
        <span class="tiny-hide">SERVED</span> <b id="sc-served">0/0</b>
        <span class="tiny-hide sep">·</span>
        <span class="tiny-hide">LOST</span><span class="tiny-only">✕</span><b id="sc-lost">0</b>
      </span>
    </div>
  </header>

  <main id="board">
    <canvas id="game"></canvas>
    <div id="notice" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <!-- The end screens are overlays now (PLAN §11.9), not a banner inside the board. -->
  </main>

  <footer id="hud">
    <div id="tray" class="hidden">
      <canvas id="tray-canvas"></canvas>
      <div class="tray-side">
        <span id="tray-hint" class="hint"></span>
        <div class="tray-controls">
          <!-- ROTATE keeps a counter rather than its key: which of four rotations you are looking
               at is the thing you need mid-placement, and the title says R. CONFIRM's badge is
               the key, like every other button in the game now. -->
          <button id="btn-rotate" title="Rotate — key R"><span class="narrow-hide">ROTATE</span><span class="narrow-only">ROT</span> <i id="rot-label">1/1</i></button>
          <button id="btn-confirm" title="Commit the block · 1 turn · key Enter" disabled><span class="narrow-hide">CONFIRM</span><span class="narrow-only">OK</span> <i>↵</i></button>
        </div>
      </div>
    </div>
    <div id="actionbar"></div>
    <!-- Every button in the game wears its key in the badge (owner decision 2026-08-05). The badge
         used to carry the turn cost; the cost moved into the title, because the cost is a thing you
         learn once and the key is a thing you need every turn. -->
    <div id="globals">
      <button id="btn-generate" title="Draw a block — the turn is charged when you commit it · key G"><span class="tiny-hide">GENERATE</span><span class="tiny-only">GEN</span> <i>G</i></button>
      <button id="btn-wait" title="Let a turn pass · 1 turn · key W">WAIT <i>W</i></button>
      <!-- Fast-forward (PLAN §12.6): Wait on a timer, stopped by anything worth looking at.
           No letter badge: it is a toggle rather than a verb, and its key is the space bar. -->
      <button id="btn-run" title="Fast-forward: waits every 180 ms until something happens · key Space">RUN</button>
    </div>
    <!-- Zoom is a gesture first (pinch/wheel); these are the same camera call with a button
         on it, for anyone whose hands or screen make a two-finger pinch awkward. -->
    <div id="viewtools">
      <div id="zoom">
        <button id="btn-zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="btn-zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <!-- Reopens the rules. On a phone the only other way back to them is a refresh,
             which rerolls the seed and throws the game away. -->
        <button id="btn-help" title="How to play" aria-label="How to play">?</button>
      </div>
      <canvas id="minimap" title="Tap to jump"></canvas>
    </div>
  </footer>

  <!-- The user roster (src/ui/roster.js), opened from the WAITING chip above. Empty markup:
       the ids are the contract, every row inside is derived from the state. It is fixed-
       position, so it is not a fourth row of the body grid and cannot move the board. -->
  <div id="roster" class="hidden">
    <div id="roster-card" role="dialog" aria-label="Users">
      <div class="roster-head">
        <h2>USERS</h2>
        <span class="hint">TAP A ROW TO JUMP</span>
        <button id="roster-close" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <div id="roster-list"></div>
    </div>
  </div>

  <!-- The menu drawer (src/ui/drawer.js), opened from ☰ and holding everything the walker-first
       top bar handed off. Same scrim-tap, Esc and toggle discipline as the roster above, hung on
       the other side of the screen and mutually exclusive with it (main.js closes one to open the
       other), so a tap on a scrim is never ambiguous about which panel it belongs to. -->
  <div id="drawer" class="hidden">
    <div id="drawer-card" role="dialog" aria-label="Game menu">
      <div class="drawer-head">
        <h2>GAME</h2>
        <button id="drawer-close" title="Close (Esc)" aria-label="Close">✕</button>
      </div>
      <div class="drawer-body">
        <label class="drawer-row" for="f-level"><span>LEVEL</span><select id="f-level"></select></label>
        <button id="seed" class="chip" title="Copy a link that replays this exact game">SEED —</button>
        <div class="drawer-row"><span>TURN</span><b id="tick">0</b></div>
        <!-- REMAINING moved in here, and SPEC §6.1's persistently-visible demand forecast is
             still satisfied on the bar: SERVED x/y states the same fact from both ends (the
             remainder is the gap between its two numbers, both of them on screen) and NEXT IN
             carries the cadence. What came in here is a third reading of numbers already up
             there, not the forecast itself. -->
        <div class="drawer-row"><span>REMAINING</span><b id="fc-remaining">—</b></div>
      </div>
    </div>
  </div>

  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
