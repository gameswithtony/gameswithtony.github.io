<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Slop Sweeper</title>
  <meta name="description" content="A turn-based puzzle about building software under deadline with AI assistance.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌊</text></svg>">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- HUD is DOM, board is canvas (SPEC §10.3). The ids are the contract with src/ui/hud.js. -->
  <header id="topbar">
    <label class="field"><span class="tiny-hide">LEVEL</span>
      <select id="f-level"></select>
    </label>
    <button id="btn-restart" class="chip" title="New game — rerolls the seed unless ?seed= pins it">RESTART</button>
    <button id="seed" class="chip" title="Copy a link that replays this exact game">SEED —</button>
    <span class="chip">TICK <b id="tick">0</b></span>
    <!-- The score. Users served is the whole point total; users lost are the ones no amount
         of building brings back. -->
    <span id="score" class="chip" title="Users served · users lost for good">
      <span class="narrow-hide">SERVED</span> <b id="sc-served">0/0</b>
      <span class="narrow-hide sep">·</span>
      <span class="narrow-hide">LOST</span><span class="narrow-only">✕</span><b id="sc-lost">0</b>
    </span>
    <!-- The forecast trio is persistent UI (SPEC §6.1); below 560px it keeps the numbers
         and shortens the words rather than being clipped. -->
    <div id="forecast" class="forecast">
      <span title="Users still to be served"><span class="tiny-hide">REMAINING</span><span class="tiny-only">LEFT</span> <b id="fc-remaining">—</b></span>
      <span title="Turns until the next user arrives"><span class="tiny-hide">NEXT IN</span><span class="tiny-only">NEXT</span> <b id="fc-next">—</b></span>
      <span title="Users waiting right now"><span class="tiny-hide">WAITING</span><span class="tiny-only">WAIT</span> <b id="fc-waiting">—</b></span>
    </div>
  </header>

  <main id="board">
    <canvas id="game"></canvas>
    <div id="notice" class="hidden"></div>
    <div id="toast" class="hidden"></div>
    <!-- The end screens are overlays now (PLAN §11.9), not a banner inside the board. -->
  </main>

  <footer id="hud">
    <div id="tray" class="hidden">
      <canvas id="tray-canvas"></canvas>
      <div class="tray-side">
        <span id="tray-hint" class="hint"></span>
        <div class="tray-controls">
          <button id="btn-rotate" title="Rotate (R)"><span class="narrow-hide">ROTATE</span><span class="narrow-only">ROT</span> <i id="rot-label">1/1</i></button>
          <button id="btn-confirm" title="Commit the block (Enter)" disabled><span class="narrow-hide">CONFIRM</span><span class="narrow-only">OK</span> <i>1</i></button>
        </div>
      </div>
    </div>
    <div id="actionbar"></div>
    <div id="globals">
      <button id="btn-generate" title="Draw a block — the turn is charged when you commit it"><span class="tiny-hide">GENERATE</span><span class="tiny-only">GEN</span> <i>0</i></button>
      <button id="btn-wait" title="Let a tick pass">WAIT <i>1</i></button>
      <!-- Fast-forward (PLAN §12.6): Wait on a timer, stopped by anything worth looking at. -->
      <button id="btn-run" title="Fast-forward: waits every 180 ms until something happens">RUN</button>
    </div>
    <!-- Zoom is a gesture first (pinch/wheel); these are the same camera call with a button
         on it, for anyone whose hands or screen make a two-finger pinch awkward. -->
    <div id="viewtools">
      <div id="zoom">
        <button id="btn-zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button>
        <button id="btn-zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button>
        <!-- Reopens the rules. On a phone the only other way back to them is a refresh,
             which rerolls the seed and throws the game away. -->
        <button id="btn-help" title="How to play" aria-label="How to play">?</button>
      </div>
      <canvas id="minimap" title="Tap to jump"></canvas>
    </div>
  </footer>

  <script type="module" src="./src/ui/main.js"></script>
</body>
</html>
