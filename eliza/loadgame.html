<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet">
    <script src="lz-string.min.js"></script>
    <link rel="stylesheet" href="styles.css">
    <title>Eliza - Brass: Birmingham Solo Mode</title>
</head>
<body style="display: block; padding: 1rem;">
    <h1 style="display: block;">Load Game Data</h1>
    <textarea id="gamestateencoded" rows="10" style="width: 500px"></textarea>
    <br /><button onclick="loadData()">Load Data</button>
    <p style="display: block;"><a href="index.html">Go back to Eliza and Eleanor</a></p>
    
</body>
<script>
    function loadData() {
        let text = document.getElementById("gamestateencoded").value.trim();
        if (!confirm("This replaces the game saved in this browser. Continue?")) return;
        let json;
        try {
            if (text.indexOf("ELIZA2:") === 0) {
                // version 2 bug report: LZ-compressed, base64
                json = LZString.decompressFromBase64(text.slice(7));
            } else {
                // older reports: plain base64 of the saved JSON
                json = decodeURIComponent(escape(atob(text)));
            }
            let data = JSON.parse(json);
            // version 2 saves have "v":2 and live under their own key
            let key = data.v === 2 ? "elizagamestate2" : "elizagamestate";
            localStorage.setItem(key, LZString.compress(json));
            alert("Game State Loaded");
        } catch (e) {
            alert("That doesn't look like a saved game: " + e.message);
        }
    }
</script>
</html>
