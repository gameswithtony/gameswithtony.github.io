<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Pathfinder · load game state</title>
    <link rel="stylesheet" href="styles.css">
    <script>
        // apply the saved theme before first paint; dark unless light was chosen
        (function () {
            var t = null;
            try { t = localStorage.getItem('pathfinder.theme'); } catch (e) { /* storage blocked */ }
            if (t !== 'light') t = 'dark';
            document.documentElement.setAttribute('data-theme', t);
            var m = document.querySelector('meta[name="theme-color"]');
            if (m) m.setAttribute('content', t === 'dark' ? '#070d14' : '#e8edf2');
        })();
    </script>
    <script src="lz-string.min.js"></script>
    <style>
        body { padding: 16px; } main { max-width: 640px; margin: 0 auto; display: grid; gap: 12px; }
        textarea { width: 100%; min-height: 180px; font: 12px monospace; background: var(--sunken); color: var(--ink); border: 1px solid var(--border); border-radius: 8px; padding: 8px; }
    </style>
</head>
<body>
<main>
    <h1>Load a shared game</h1>
    <p class="muted">Paste a code from <b>Menu → Share game state</b>. This replaces the game saved in this browser.</p>
    <textarea id="code" placeholder="PATHFINDER1:…" aria-label="Game state code"></textarea>
    <button class="btn primary" onclick="loadCode()">Load game</button>
    <p id="msg" role="status"></p>
    <p><a href="index.html">Back to Pathfinder</a></p>
</main>
<script>
    function loadCode() {
        const msg = document.getElementById('msg');
        const text = document.getElementById('code').value.trim();
        try {
            if (!text.startsWith('PATHFINDER1:')) throw new Error('code should start with PATHFINDER1:');
            const json = LZString.decompressFromBase64(text.slice('PATHFINDER1:'.length));
            const st = JSON.parse(json);
            if (!st || st.v !== 1 || !st.stack) throw new Error('not a Pathfinder game');
            if (!confirm('Replace the game saved in this browser?')) return;
            localStorage.setItem('pathfinder.v1', LZString.compressToUTF16(JSON.stringify({ st, undo: [] })));
            msg.textContent = 'Loaded. Opening the game…';
            location.href = 'index.html';
        } catch (e) {
            msg.textContent = "That doesn't look like a Pathfinder game code: " + e.message;
        }
    }
</script>
</body>
</html>
